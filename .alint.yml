# yaml-language-server: $schema=https://alint.org/_alint/configuration/schema.json
version: 1

rules:
  - id: require-pixi-manifest
    kind: file_exists
    paths: pixi.toml
    level: error
    message: Required pixi.toml is missing.
  - id: require-pixi-lock
    kind: file_exists
    paths: pixi.lock
    level: error
    message: Required pixi.lock is missing.
  - id: require-sandbox-config
    kind: file_exists
    paths: pixi-sandbox.toml
    level: error
    message: Required pixi-sandbox.toml is missing.
  - id: require-sandbox-workflow
    kind: file_exists
    paths: .github/workflows/pixi-sandbox.yml
    level: error
    message: Sandbox publishing workflow is missing.
  - id: require-package-manifest
    kind: file_exists
    paths: packages/artifactspec/pyproject.toml
    level: error
    message: ArtifactSpec package manifest is missing.
  - id: require-hooks
    kind: file_exists
    paths: lefthook.yml
    level: error
    message: Required lefthook.yml is missing.
  - id: require-ruff-config
    kind: file_exists
    paths: ruff.toml
    level: error
    message: Required ruff.toml is missing.
  - id: require-gherlint-config
    kind: file_exists
    paths: gherlint.toml
    level: error
    message: Required gherlint.toml is missing.
  - id: require-bun-manifest
    kind: file_exists
    paths: package.json
    level: error
    message: Developer tooling manifest is missing.
  - id: require-bun-lock
    kind: file_exists
    paths: bun.lock
    level: error
    message: Bun lockfile is missing.
  - id: require-skills-lock
    kind: file_exists
    paths: skills-lock.json
    level: error
    message: Skills lockfile is missing.
  - id: require-convco-config
    kind: file_exists
    paths: .versionrc
    level: error
    message: Convco configuration is missing.
  - id: require-codecov-config
    kind: file_exists
    paths: codecov.yml
    level: error
    message: Codecov configuration is missing.
  - id: require-vale-config
    kind: file_exists
    paths: .vale.ini
    level: error
    message: Required Vale configuration is missing.
  # Applicable PCC-R03 and PCC-R04 repository policy, adapted to this layout.
  - id: pcc-r03-bun-package-manager
    kind: json_path_matches
    paths: package.json
    path: $.packageManager
    matches: '^bun@1\.4\.[0-9]+$'
    level: error
    message: '[PCC-R03] Pin the Bun package manager version.'
  - id: pcc-r04-readme
    kind: file_exists
    paths: README.md
    level: error
    message: '[PCC-R04] Keep the project README.'
  - id: pcc-r04-agents
    kind: file_exists
    paths: AGENTS.md
    level: error
    message: '[PCC-R04] Keep agent instructions.'
  - id: pcc-r04-contributing
    kind: file_exists
    paths: CONTRIBUTING.md
    level: error
    message: '[PCC-R04] Keep contributing guidance.'
  - id: pcc-r04-docs-index
    kind: file_exists
    paths: docs/README.md
    level: error
    message: '[PCC-R04] Keep a documentation index.'
  - id: require-rude-config
    kind: file_exists
    paths: pyproject.toml
    level: error
    message: Rude clean code configuration is missing.
