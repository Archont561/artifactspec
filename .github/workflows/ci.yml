name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.detect.outputs.scope }}
      run_docs: ${{ steps.detect.outputs.run_docs }}
      run_scripts: ${{ steps.detect.outputs.run_scripts }}
      run_full: ${{ steps.detect.outputs.run_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/detect_changes.py --base "$BASE_SHA" --head "$HEAD_SHA" --event "$EVENT_NAME"

  commit-messages:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.1
          locked: true
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          RANGE="$(python scripts/select_commit_range.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --event "$EVENT_NAME" \
            --forced "${EVENT_FORCED:-false}" --ref "$EVENT_REF" --default-branch "$DEFAULT_BRANCH")"
          printf 'Checking commits: %s\n' "$RANGE"
          pixi run --locked -x convco check --merges "$RANGE"

  docs:
    name: Documentation and backlog
    needs: changes
    if: needs.changes.outputs.run_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.1
          locked: true
      - run: pixi run --locked lint-prose
      - run: pixi run --locked alint
      - name: Check whitespace in changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          fi
          git diff --check "$BASE_SHA" "$HEAD_SHA" --

  scripts:
    name: Scripts suite
    needs: changes
    if: needs.changes.outputs.run_scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.1
          locked: true
      - run: pixi run --locked lint
      - run: pixi run --locked test-scripts

  full:
    name: Full checks and coverage
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.1
          locked: true
      - run: pixi run --locked lint
      - run: pixi run --locked format-check
      - run: pixi run --locked typecheck
      - run: pixi run --locked check-packages
      - run: pixi run --locked audit
      - run: pixi run --locked alint
      - run: pixi run --locked lint-prose
      - run: pixi run --locked actionlint
      - run: pixi run --locked -e gherkin lint-features
      - run: pixi run --locked coverage-all
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      - name: Explain skipped upload for fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'Codecov upload skipped for fork pull requests; tests and coverage still ran.'

  manim-environment:
    name: Optional Manim environment
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.1
          run-install: false
      - run: pixi run --locked -e manim -x python -c "import manim; print(manim.__version__)"
      - run: pixi run --locked -e manim -x ffmpeg -version

  compatibility:
    name: Core Python ${{ matrix.python }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install core and test dependencies
        run: |
          python -m pip install -e "packages/artifactspec[dev]"
          python -m pip install --no-deps packages/artifactspec-svg packages/artifactspec-events
      - name: Test core package
        run: python -m pytest packages/artifactspec/tests packages/artifactspec-svg/tests packages/artifactspec-events/tests

  ci-result:
    name: CI result
    if: always()
    needs: [changes, commit-messages, docs, scripts, full, compatibility, manim-environment]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          COMMITS_RESULT: ${{ needs.commit-messages.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          SCRIPTS_RESULT: ${{ needs.scripts.result }}
          FULL_RESULT: ${{ needs.full.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          MANIM_RESULT: ${{ needs.manim-environment.result }}
          RUN_DOCS: ${{ needs.changes.outputs.run_docs }}
          RUN_SCRIPTS: ${{ needs.changes.outputs.run_scripts }}
          RUN_FULL: ${{ needs.changes.outputs.run_full }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == success && "$COMMITS_RESULT" == success ]]
          [[ "$RUN_DOCS" == true || "$RUN_SCRIPTS" == true || "$RUN_FULL" == true ]]
          [[ "$RUN_DOCS" != true || "$DOCS_RESULT" == success ]]
          [[ "$RUN_SCRIPTS" != true || "$SCRIPTS_RESULT" == success ]]
          [[ "$RUN_FULL" != true || "$FULL_RESULT" == success ]]
          [[ "$RUN_FULL" != true || "$COMPATIBILITY_RESULT" == success ]]
          [[ "$RUN_FULL" != true || "$MANIM_RESULT" == success ]]
          echo 'All selected CI checks passed.'
