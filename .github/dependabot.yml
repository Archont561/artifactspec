version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /packages/artifactspec
    schedule:
      interval: weekly
    # Twine 6.2 in pixi.lock cannot validate the metadata emitted by Hatchling >=1.30.
    ignore:
      - dependency-name: hatchling
        versions: ['>=1.30']
  - package-ecosystem: pip
    directory: /packages/artifactspec-manim
    schedule:
      interval: weekly
    ignore:
      - dependency-name: hatchling
        versions: ['>=1.30']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
