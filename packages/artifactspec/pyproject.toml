[build-system]
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[project]
name = "artifactspec"
version = "0.1.0"
description = "A framework for describing and producing visual artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pygls>=2.1.1,<3", "typer>=0.24,<0.29"]

[project.scripts]
artifactspec = "artifactspec.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-bdd>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1", "pytest-cov>=6,<8", "hatchling>=1.27,<1.30"]

[project.urls]
Repository = "https://github.com/Archont561/artifactspec"
Issues = "https://github.com/Archont561/artifactspec/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/artifactspec"]
