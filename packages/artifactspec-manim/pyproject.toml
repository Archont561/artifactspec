[build-system]
requires = ["hatchling>=1.27,<1.34"]
build-backend = "hatchling.build"

[project]
name = "artifactspec-manim"
version = "0.1.0"
description = "Version-only placeholder for a future Manim integration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/Archont561/artifactspec"
Issues = "https://github.com/Archont561/artifactspec/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/artifactspec_manim"]
