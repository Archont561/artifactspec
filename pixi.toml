[workspace]
name = "artifactspec"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.14"
lefthook = ">=2.2,<3"
bun = ">=1.4.2,<1.5"
convco = ">=0.7.2,<0.8"
actionlint = ">=1.7,<2"
shellcheck = ">=0.11,<1"

[pypi-dependencies]
# Keep these constraints aligned with the published package metadata.
artifactspec = { path = "./packages/artifactspec", editable = true, extras = ["dev"] }
artifactspec-manim = { path = "./packages/artifactspec-manim", editable = true }
pytest = ">=8,<10"
pytest-bdd = ">=8,<10"
pytest-cov = ">=6,<8"
ruff = ">=0.11,<1"
alint = ">=0.20,<1"
mypy = ">=1.15, <2"
build = ">=1.2, <2"
twine = ">=6.2, <7"
pip-audit = ">=2.9, <3"
packaging = ">=26, <27"

[tasks]
test = "python -m pytest packages/artifactspec/tests"
test-scripts = "python -m pytest scripts/tests"
test-manim = "python -m pytest packages/artifactspec-manim/tests"
coverage-all = "python -m pytest scripts/tests packages/artifactspec/tests packages/artifactspec-manim/tests --cov=packages/artifactspec/src --cov=packages/artifactspec-manim/src --cov-report=term-missing --cov-report=xml:coverage.xml"
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy packages/artifactspec/src packages/artifactspec-manim/src"
audit = "pip-audit --local --skip-editable"
check-packages = "python scripts/check_packages.py"
alint = "alint check"
actionlint = "actionlint .github/workflows/*.yml"
hooks-install = "lefthook install"
coverage = "python -m pytest packages/artifactspec/tests --cov=packages/artifactspec/src --cov-report=term-missing --cov-report=xml:coverage.xml"
lint-commit = "convco check --from-stdin --strip"
bun-install = "bun install --frozen-lockfile"
backlog = { cmd = "bun x --bun --no-install backlog", depends-on = ["bun-install"] }
skills = { cmd = "bun x --bun --no-install skills", depends-on = ["bun-install"] }

# Isolate gherlint 0.5 and its Pydantic 1 dependency.
[feature.gherkin.dependencies]
python = ">=3.11,<3.14"

[feature.gherkin.pypi-dependencies]
gherlint = ">=0.5,<0.6"

[feature.gherkin.tasks]
lint-features = "python scripts/check_gherkin.py"

[environments]
gherkin = { features = ["gherkin"], no-default-feature = true }
