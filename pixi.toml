[workspace]
name = "artifactspec"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.14"
lefthook = ">=2.2,<3"
bun = ">=1.4.2,<1.5"
convco = ">=0.7.2,<0.8"
actionlint = ">=1.7,<2"
shellcheck = ">=0.11,<1"

[pypi-dependencies]
# The build backend is locked so local projects can be installed without network.
hatchling = ">=1.27,<1.30"
lark = ">=1.3.1,<2"
pygls = ">=2.1.1,<3"
typer = ">=0.24,<0.29"
pytest = ">=8,<10"
pytest-bdd = ">=8,<10"
pytest-cov = ">=6,<8"
ruff = ">=0.11,<1"
alint = ">=0.20,<1"
mypy = ">=1.15, <2"
build = ">=1.2, <2"
twine = ">=6.2, <7"
pip-audit = ">=2.9, <3"
packaging = ">=26, <27"
hypothesis = ">=6, <7"

# Pixi evaluates activation.env in the platform shell. Disable word splitting and
# globbing inside the substitution so checkout paths containing spaces are safe.
[activation.env]
PYTHONPATH = '$(IFS=; set -f; python ${PIXI_PROJECT_ROOT}/scripts/activate.py)'

[tasks]
# Install only local project wheels, without dependency resolution or network access.
install-projects = "python -m pip install --no-deps --no-build-isolation --force-reinstall ./packages/artifactspec ./packages/artifactspec-manim"
test = { cmd = "python -m pytest packages/artifactspec/tests", depends-on = ["install-projects"] }
test-scripts = { cmd = "python -m pytest scripts/tests", depends-on = ["bun-install"] }
test-manim = { cmd = "python -m pytest packages/artifactspec-manim/tests", depends-on = ["install-projects"] }
coverage-all = { cmd = "python -m pytest scripts/tests packages/artifactspec/tests packages/artifactspec-manim/tests --cov=packages/artifactspec/src --cov=packages/artifactspec-manim/src --cov-report=term-missing --cov-report=xml:coverage.xml", depends-on = ["install-projects", "bun-install"] }
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy packages/artifactspec/src packages/artifactspec-manim/src"
audit = "pip-audit --local --skip-editable"
check-packages = "python scripts/check_packages.py"
alint = "alint check"
lint-prose = { cmd = "node_modules/@taskless/vale-linux-x64/vale --no-global README.md AGENTS.md CONTRIBUTING.md CHANGELOG.md docs backlog packages/*/README.md", depends-on = ["bun-install"] }
actionlint = "actionlint .github/workflows/*.yml"
install-hooks = "sh scripts/install_hooks.sh"
# Backwards-compatible alias.
hooks-install = { depends-on = ["install-hooks"] }
coverage = { cmd = "python -m pytest packages/artifactspec/tests --cov=packages/artifactspec/src --cov-report=term-missing --cov-report=xml:coverage.xml", depends-on = ["install-projects"] }
lint-commit = "convco check --from-stdin --strip"
bun-install = "bun install --frozen-lockfile"
backlog = { cmd = "bun x --bun --no-install backlog", depends-on = ["bun-install"] }
skills = { cmd = "bun x --bun --no-install skills", depends-on = ["bun-install"] }

# Keep the heavyweight renderer optional and outside the developer sandbox.
# Use prebuilt native bindings so PyPI's Manim doesn't build its sdists locally.
[feature.manim.dependencies]
manimpango = ">=0.7,<1"
pycairo = ">=1.14,<2"
ffmpeg = ">=7,<9"

[feature.manim.pypi-dependencies]
manim = ">=0.22.1, <0.23"

# Isolate gherlint 0.5 and its Pydantic 1 dependency.
[feature.gherkin.dependencies]
python = ">=3.11,<3.14"

[feature.gherkin.pypi-dependencies]
gherlint = ">=0.5,<0.6"

[feature.gherkin.tasks]
lint-features = "python scripts/check_gherkin.py"

[environments]
gherkin = { features = ["gherkin"], no-default-feature = true }
manim = { features = ["manim"] }
